experiment_name: smoke
model: google-t5/t5-small
seed: 42
device: mps
prefix: "reconstruct gloss: "
max_source_length: 32
max_target_length: 32
batch_size: 2
learning_rate: 0.001
epochs: 1
max_steps: 8
weight_decay: 0.0
num_beams: 2
output_dir: checkpoints/smoke
data:
  train: datasets/processed/aslg_pc12/train.jsonl
  validation: datasets/processed/aslg_pc12/validation.jsonl
  max_train_examples: 512
  max_validation_examples: 64
  use_synthetic: false
grammar:
  enabled: false
  num_labels: 6
  lambda: 0.25
