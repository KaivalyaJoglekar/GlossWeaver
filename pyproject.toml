[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "glossweaver"
version = "0.1.0"
description = "Grammar-aware reconstruction of fluent English from gloss-style text"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "accelerate>=0.28",
  "bert-score>=0.3.13",
  "datasets>=2.18",
  "matplotlib>=3.8",
  "nltk>=3.8",
  "numpy>=1.26",
  "pandas>=2.1",
  "rouge-score>=0.1.2",
  "sacrebleu>=2.4",
  "scikit-learn>=1.4",
  "sentencepiece>=0.2",
  "spacy>=3.7",
  "torch>=2.2",
  "tokenizers>=0.19",
  "tqdm>=4.66",
  "transformers>=4.40,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
glossweaver-train = "glossweaver.training.train:main"
glossweaver-evaluate = "glossweaver.evaluation.evaluate:main"
glossweaver-infer = "glossweaver.inference:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
